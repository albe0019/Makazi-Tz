<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakaziTZ – Rentals &amp; Accommodation in Tanzania</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style type="text/tailwindcss">
.inp{@apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500}
.btn{@apply inline-flex items-center justify-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 disabled:opacity-50}
.btn2{@apply inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50}
.card{@apply rounded-xl border border-slate-200 bg-white p-5 shadow-sm}
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const {useState,useEffect,useContext,createContext}=React;
const html=htm.bind(React.createElement);
const B='property-media';
let cfg=null;try{cfg=JSON.parse(localStorage.getItem('mk_cfg'))}catch(e){}
const sb=cfg?supabase.createClient(cfg.url,cfg.key):null;

/* ---------- constants & helpers ---------- */
const CATS=[{slug:'apartments',name:'Apartments',icon:'🏢',path:'/apartments',d:'Flats, studios and serviced apartments'},
 {slug:'homestays',name:'Homestays',icon:'🏡',path:'/homestays',d:'Stay with local hosts, short or long'},
 {slug:'rooms',name:'Rooms for Rent',icon:'🛏️',path:'/rooms',d:'Vyumba vya kupanga – affordable rooms'}];
const TYPES={apartments:['Studio','Flat','Penthouse','Serviced apartment'],homestays:['Entire home','Private room','Guest house','Cottage'],rooms:['Single room','Self-contained room','Shared room','Master room']};
const REGIONS='Arusha,Dar es Salaam,Dodoma,Geita,Iringa,Kagera,Katavi,Kigoma,Kilimanjaro,Lindi,Manyara,Mara,Mbeya,Mjini Magharibi,Morogoro,Mtwara,Mwanza,Njombe,Pemba North,Pemba South,Pwani,Rukwa,Ruvuma,Shinyanga,Simiyu,Singida,Songwe,Tabora,Tanga,Unguja North,Unguja South'.split(',');
const AMEN=['Water','Electricity','Own LUKU meter','Wi-Fi','Parking','Security guard','Fence','CCTV','Air conditioning','Hot water','Kitchen','Balcony','Garden','Generator','Water tank','Lift','Breakfast','Laundry'];
const PS='*, property_categories(slug,name), property_locations(*), property_images(*)';
const one=x=>Array.isArray(x)?x[0]:x;
const must=r=>{if(r.error)throw r.error;return r.data};
const tzs=n=>'TSh '+Number(n).toLocaleString('en-US');
const cover=p=>{const im=(p.property_images||[]).filter(i=>i.kind==='image');return(im.find(i=>i.is_cover)||im[0])?.url};
const go=p=>{location.hash='#'+p};
const ROLE_LABEL={tenant:'Tenant',landlord:'Landlord',broker:'Broker / Agent',admin:'Administrator'};

function useQ(fn,deps){const [s,setS]=useState({loading:true});
 useEffect(()=>{let ok=1;setS({loading:true});fn().then(d=>ok&&setS({loading:false,data:d})).catch(e=>ok&&setS({loading:false,error:e.message||String(e)}));return()=>{ok=0}},deps);return s}
function useHash(){const [h,setH]=useState(location.hash.slice(1)||'/');
 useEffect(()=>{const f=()=>{setH(location.hash.slice(1)||'/');scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);return h}

async function compress(file){
 if(!file.type.startsWith('image/'))throw new Error('not image');
 const bmp=await createImageBitmap(file),sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 let b=await new Promise(r=>c.toBlob(r,'image/webp',.8));
 if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
 return b}

/* ---------- auth ---------- */
const AuthCtx=createContext();const useAuth=()=>useContext(AuthCtx);
function AuthProvider({children}){
 const [s,setS]=useState({loading:true,user:null,profile:null,role:null});
 const load=async session=>{
  if(!session){setS({loading:false,user:null,profile:null,role:null});return}
  const u=session.user;
  const [p,r]=await Promise.all([sb.from('profiles').select('*').eq('id',u.id).maybeSingle(),sb.from('user_roles').select('role').eq('user_id',u.id).maybeSingle()]);
  setS({loading:false,user:u,profile:p.data,role:r.data?r.data.role:'tenant'})};
 const reload=()=>sb.auth.getSession().then(({data})=>load(data.session));
 useEffect(()=>{reload();
  const {data}=sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY')go('/reset');setTimeout(()=>load(session),0)});
  return()=>data.subscription.unsubscribe()},[]);
 return html`<${AuthCtx.Provider} value=${{...s,reload}}>${children}<//>`}

/* ---------- ui bits ---------- */
class Boundary extends React.Component{
 constructor(p){super(p);this.state={e:null}}
 static getDerivedStateFromError(e){return{e}}
 render(){return this.state.e?html`<div class="mx-auto max-w-md p-8 text-center"><h2 class="text-xl font-bold">Something went wrong</h2><p class="mt-2 text-sm text-slate-600">${String(this.state.e.message||this.state.e)}</p><button class="btn mt-4" onClick=${()=>{this.setState({e:null});go('/')}}>Back home</button></div>`:this.props.children}}
const Msg=({m})=>m?html`<div class=${'rounded-lg p-3 text-sm '+(m.e?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-800')}>${m.e||m.ok}</div>`:null;
const Spin=()=>html`<div class="p-10 text-center text-sm text-slate-500">Loading…</div>`;
const Fld=({l,children,c})=>html`<label class=${'block '+(c||'')}><span class="mb-1 block text-sm font-medium">${l}</span>${children}</label>`;
const Sel=({v,on,opts,ph})=>html`<select class="inp" value=${v} onChange=${e=>on(e.target.value)}>${ph!=null&&html`<option value="">${ph}</option>`}${opts.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`;

function Setup(){
 const [u,setU]=useState(''),[k,setK]=useState('');
 const save=e=>{e.preventDefault();localStorage.setItem('mk_cfg',JSON.stringify({url:u.trim(),key:k.trim()}));location.reload()};
 return html`<div class="mx-auto max-w-lg p-6"><div class="card mt-10"><h1 class="text-2xl font-bold text-emerald-700">MakaziTZ setup</h1>
 <p class="mt-2 text-sm text-slate-600">This app needs a Supabase project. 1) Create one at supabase.com. 2) Run <b>schema.sql</b> in the SQL Editor. 3) Paste Project URL and anon public key (Settings → API). The key is stored only in this browser.</p>
 <form onSubmit=${save} class="mt-4 space-y-3"><${Fld} l="Project URL"><input required class="inp" placeholder="https://xxxx.supabase.co" value=${u} onInput=${e=>setU(e.target.value)}/><//>
 <${Fld} l="Anon public key"><input required class="inp" value=${k} onInput=${e=>setK(e.target.value)}/><//><button class="btn w-full">Save and start</button></form></div></div>`}

/* ---------- layout ---------- */
function Nav(){
 const {user,role,profile}=useAuth();const [o,setO]=useState(false);
 const L=[['/','Home'],['/explore','Explore'],['/apartments','Apartments'],['/homestays','Homestays'],['/rooms','Rooms']];
 return html`<header class="sticky top-0 z-30 border-b bg-white/95 backdrop-blur"><div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
 <a href="#/" class="text-xl font-extrabold text-emerald-700">Makazi<span class="text-amber-500">TZ</span></a>
 <nav class="hidden items-center gap-5 text-sm font-medium md:flex">${L.map(([t,n])=>html`<a key=${t} href=${'#'+t} class="hover:text-emerald-700">${n}</a>`)}</nav>
 <div class="hidden items-center gap-2 md:flex">${user?html`<a class="btn2" href="#/dashboard">${profile?.full_name||'Dashboard'} · ${ROLE_LABEL[role]}</a><button class="btn" onClick=${async()=>{await sb.auth.signOut();go('/')}}>Logout</button>`:html`<a class="btn2" href="#/login">Login</a><a class="btn" href="#/register">Register</a>`}</div>
 <button class="rounded-lg border px-3 py-1.5 md:hidden" aria-label="Menu" onClick=${()=>setO(!o)}>${o?'✕':'☰'}</button></div>
 ${o&&html`<div class="space-y-1 border-t bg-white px-4 py-3 md:hidden" onClick=${()=>setO(false)}>${[...L,['/about','About'],['/contact','Contact']].map(([t,n])=>html`<a key=${t} href=${'#'+t} class="block rounded px-2 py-2 hover:bg-slate-100">${n}</a>`)}
 ${user?html`<a href="#/dashboard" class="block rounded px-2 py-2 font-semibold text-emerald-700">Dashboard</a><button class="block w-full rounded px-2 py-2 text-left" onClick=${async()=>{await sb.auth.signOut();go('/')}}>Logout</button>`:html`<a href="#/login" class="block rounded px-2 py-2">Login</a><a href="#/register" class="block rounded px-2 py-2 font-semibold text-emerald-700">Register</a>`}</div>`}</header>`}
const Footer=()=>html`<footer class="mt-16 border-t bg-white"><div class="mx-auto flex max-w-6xl flex-wrap justify-between gap-3 px-4 py-6 text-sm text-slate-500"><span>© ${new Date().getFullYear()} MakaziTZ · Tanzania</span><span class="space-x-4"><a href="#/about">About</a><a href="#/contact">Contact</a><button onClick=${()=>{if(confirm('Remove saved Supabase settings?')){localStorage.removeItem('mk_cfg');location.reload()}}}>Backend settings</button></span></div></footer>`;

/* ---------- property display ---------- */
function Card({p}){const l=one(p.property_locations)||{};
 return html`<a href=${'#/property/'+p.id} class="group overflow-hidden rounded-xl border bg-white shadow-sm transition hover:shadow-md">
 <div class="relative aspect-[4/3] bg-slate-200">${cover(p)?html`<img src=${cover(p)} loading="lazy" alt=${p.title} class="h-full w-full object-cover"/>`:html`<div class="grid h-full place-items-center text-3xl">🏠</div>`}
 <span class="absolute left-2 top-2 rounded-full bg-white/90 px-2 py-0.5 text-xs font-semibold">${p.property_categories?.name}</span>
 ${p.availability!=='available'&&html`<span class="absolute right-2 top-2 rounded-full bg-red-600 px-2 py-0.5 text-xs font-semibold text-white">${p.availability}</span>`}</div>
 <div class="p-4"><div class="font-bold text-emerald-700">${tzs(p.price)} <span class="text-xs font-normal text-slate-500">/ ${p.rental_period}</span></div>
 <h3 class="mt-1 line-clamp-1 font-semibold group-hover:text-emerald-700">${p.title}</h3>
 <p class="text-sm text-slate-500">📍 ${[l.street,l.ward,l.district,l.region].filter(Boolean).join(', ')}</p>
 <p class="mt-1 text-xs text-slate-500">${p.property_type} · ${p.bedrooms} bd · ${p.bathrooms} ba</p></div></a>`}

function Listing({cat,title,sub}){
 const q0=new URLSearchParams((location.hash.split('?')[1])||'');
 const [q,setQ]=useState(q0.get('q')||''),[reg,setReg]=useState(''),[cf,setCf]=useState(cat||''),[sort,setSort]=useState('new');
 const r=useQ(async()=>must(await sb.from('properties').select(PS).eq('status','published').order('created_at',{ascending:false})),[]);
 let items=(r.data||[]).filter(p=>{const l=one(p.property_locations)||{};
  return(!cf||p.property_categories?.slug===cf)&&(!reg||l.region===reg)&&(!q||(p.title+' '+(l.district||'')+' '+(l.ward||'')+' '+(l.street||'')).toLowerCase().includes(q.toLowerCase()))});
 if(sort==='lo')items=[...items].sort((a,b)=>a.price-b.price);if(sort==='hi')items=[...items].sort((a,b)=>b.price-a.price);
 return html`<div class="mx-auto max-w-6xl px-4 py-8"><h1 class="text-2xl font-bold md:text-3xl">${title}</h1><p class="text-slate-500">${sub}</p>
 <div class="mt-5 grid gap-2 sm:grid-cols-2 lg:grid-cols-4"><input class="inp" placeholder="Search title, district, ward…" value=${q} onInput=${e=>setQ(e.target.value)}/>
 <${Sel} v=${reg} on=${setReg} opts=${REGIONS} ph="All regions"/>
 ${!cat?html`<select class="inp" value=${cf} onChange=${e=>setCf(e.target.value)}><option value="">All categories</option>${CATS.map(c=>html`<option key=${c.slug} value=${c.slug}>${c.name}</option>`)}</select>`:html`<div></div>`}
 <select class="inp" value=${sort} onChange=${e=>setSort(e.target.value)}><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div>
 ${r.loading?html`<${Spin}/>`:r.error?html`<div class="mt-6"><${Msg} m=${{e:r.error}}/></div>`:!items.length?html`<div class="card mt-6 text-center text-slate-500">No listings found yet.</div>`:
 html`<div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${items.map(p=>html`<${Card} key=${p.id} p=${p}/>`)}</div>`}</div>`}

function Details({id}){
 const {user}=useAuth();const [i,setI]=useState(0);
 const r=useQ(async()=>{const p=must(await sb.from('properties').select(PS).eq('id',id).single());
  const am=must(await sb.from('property_amenities').select('amenity').eq('property_id',id));
  let o=null;if(user)o=(await sb.from('profiles').select('full_name,phone').eq('id',p.owner_id).maybeSingle()).data;
  return{p,am,o}},[id,user?.id]);
 if(r.loading)return html`<${Spin}/>`;if(r.error)return html`<div class="mx-auto max-w-xl p-6"><${Msg} m=${{e:'Listing not available: '+r.error}}/></div>`;
 const {p,am,o}=r.data,l=one(p.property_locations)||{},imgs=p.property_images.filter(x=>x.kind==='image').sort((a,b)=>b.is_cover-a.is_cover),vids=p.property_images.filter(x=>x.kind==='video');
 return html`<div class="mx-auto max-w-6xl px-4 py-6"><a href=${'#/'+(p.property_categories.slug==='rooms'?'rooms':p.property_categories.slug)} class="text-sm text-emerald-700">← Back to ${p.property_categories.name}</a>
 <div class="mt-3 grid gap-6 lg:grid-cols-3"><div class="lg:col-span-2">
 <div class="aspect-[16/10] overflow-hidden rounded-xl bg-slate-200">${imgs.length?html`<img src=${imgs[i]?.url} alt=${p.title} class="h-full w-full object-cover"/>`:html`<div class="grid h-full place-items-center text-5xl">🏠</div>`}</div>
 ${imgs.length>1&&html`<div class="mt-2 flex gap-2 overflow-x-auto">${imgs.map((m,n)=>html`<img key=${m.id} src=${m.url} onClick=${()=>setI(n)} class=${'h-16 w-24 shrink-0 cursor-pointer rounded object-cover '+(n===i?'ring-2 ring-emerald-600':'opacity-70')}/>`)}</div>`}
 ${vids.map(v=>html`<video key=${v.id} src=${v.url} controls preload="metadata" class="mt-3 w-full rounded-xl"></video>`)}
 <h1 class="mt-5 text-2xl font-bold">${p.title}</h1><p class="text-slate-500">📍 ${[l.street,l.ward,l.district,l.region].filter(Boolean).join(', ')}</p>
 <div class="mt-4 grid grid-cols-2 gap-3 text-sm sm:grid-cols-4">${[['Type',p.property_type],['Bedrooms',p.bedrooms],['Bathrooms',p.bathrooms],['Size',p.size_sqm?p.size_sqm+' m²':'—'],['Furnishing',p.furnishing],['Status',p.availability]].map(([a,b])=>html`<div key=${a} class="rounded-lg bg-white p-3 border"><div class="text-xs text-slate-500">${a}</div><div class="font-semibold capitalize">${b}</div></div>`)}</div>
 <h2 class="mt-6 font-semibold">Description</h2><p class="whitespace-pre-line text-sm text-slate-700">${p.description||'No description provided.'}</p>
 ${am.length>0&&html`<h2 class="mt-6 font-semibold">Amenities</h2><div class="mt-2 flex flex-wrap gap-2">${am.map(a=>html`<span key=${a.amenity} class="rounded-full bg-emerald-50 px-3 py-1 text-xs text-emerald-800">✓ ${a.amenity}</span>`)}</div>`}
 ${p.conditions&&html`<h2 class="mt-6 font-semibold">Rental conditions</h2><p class="whitespace-pre-line text-sm text-slate-700">${p.conditions}</p>`}</div>
 <aside><div class="card sticky top-20"><div class="text-2xl font-bold text-emerald-700">${tzs(p.price)}</div><div class="text-sm text-slate-500">per ${p.rental_period}</div>
 <div class="mt-4 border-t pt-4 text-sm">${user?(o?html`<div class="font-semibold">${o.full_name}</div>${o.phone?html`<a class="btn mt-3 w-full" href=${'tel:'+o.phone}>📞 ${o.phone}</a><a class="btn2 mt-2 w-full" target="_blank" href=${'https://wa.me/'+o.phone.replace(/\D/g,'')}>WhatsApp</a>`:html`<p class="text-slate-500">Owner has not added a phone number.</p>`}`:html`<p>Contact unavailable.</p>`):html`<p class="text-slate-600">Log in to see the owner's contact details.</p><a href="#/login" class="btn mt-3 w-full">Login</a>`}</div></div></aside></div></div>`}

/* ---------- public pages ---------- */
function Home(){
 const [q,setQ]=useState('');const r=useQ(async()=>must(await sb.from('properties').select(PS).eq('status','published').order('created_at',{ascending:false}).limit(6)),[]);
 return html`<div><section class="bg-gradient-to-br from-emerald-700 to-emerald-900 px-4 py-14 text-white md:py-20"><div class="mx-auto max-w-3xl text-center">
 <h1 class="text-3xl font-extrabold md:text-5xl">Find your next home anywhere in Tanzania</h1><p class="mt-3 text-emerald-100">Apartments, homestays and rooms for rent – from Dar es Salaam to Mbeya.</p>
 <form class="mt-6 flex gap-2 rounded-xl bg-white p-2" onSubmit=${e=>{e.preventDefault();go('/explore?q='+encodeURIComponent(q))}}><input class="min-w-0 flex-1 rounded-lg px-3 text-slate-800 outline-none" placeholder="District, ward or street…" value=${q} onInput=${e=>setQ(e.target.value)}/><button class="btn">Search</button></form></div></section>
 <section class="mx-auto max-w-6xl px-4 py-10"><div class="grid gap-4 md:grid-cols-3">${CATS.map(c=>html`<a key=${c.slug} href=${'#'+c.path} class="card transition hover:shadow-md"><div class="text-3xl">${c.icon}</div><h3 class="mt-2 font-bold">${c.name}</h3><p class="text-sm text-slate-500">${c.d}</p></a>`)}</div>
 <h2 class="mt-12 text-xl font-bold">Latest listings</h2>
 ${r.loading?html`<${Spin}/>`:r.error?html`<${Msg} m=${{e:r.error}}/>`:!r.data.length?html`<div class="card mt-4 text-center text-slate-500">No listings yet. Landlords and brokers can <a class="text-emerald-700 underline" href="#/register">register</a> and add the first one.</div>`:html`<div class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${r.data.map(p=>html`<${Card} key=${p.id} p=${p}/>`)}</div>`}</section></div>`}
const About=()=>html`<div class="mx-auto max-w-3xl px-4 py-10"><h1 class="text-3xl font-bold">About MakaziTZ</h1><p class="mt-4 text-slate-600">MakaziTZ connects tenants with landlords and brokers across Tanzania. Phase 1 delivers accounts, role dashboards and listing management with photo and video upload. Advanced search, maps and location intelligence are planned for Phase 2.</p></div>`;
function Contact(){const [f,setF]=useState({name:'',email:'',message:''}),[m,setM]=useState(null),[b,setB]=useState(false);
 const send=async e=>{e.preventDefault();setB(true);const {error}=await sb.from('contact_messages').insert(f);setB(false);if(error)setM({e:error.message});else{setM({ok:'Message sent. Thank you!'});setF({name:'',email:'',message:''})}};
 return html`<div class="mx-auto max-w-lg px-4 py-10"><h1 class="text-3xl font-bold">Contact us</h1><form onSubmit=${send} class="card mt-5 space-y-3">
 <${Fld} l="Name"><input required class="inp" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/><//><${Fld} l="Email"><input required type="email" class="inp" value=${f.email} onInput=${e=>setF({...f,email:e.target.value})}/><//>
 <${Fld} l="Message"><textarea required minlength="5" rows="4" class="inp" value=${f.message} onInput=${e=>setF({...f,message:e.target.value})}></textarea><//><${Msg} m=${m}/><button class="btn w-full" disabled=${b}>${b?'Sending…':'Send message'}</button></form></div>`}

/* ---------- auth pages ---------- */
const Shell=({t,children})=>html`<div class="mx-auto max-w-md px-4 py-10"><div class="card"><h1 class="mb-4 text-2xl font-bold">${t}</h1>${children}</div></div>`;
function Login(){const [e,setE]=useState(''),[p,setP]=useState(''),[m,setM]=useState(null),[b,setB]=useState(false);
 const sub=async x=>{x.preventDefault();setB(true);const {error}=await sb.auth.signInWithPassword({email:e,password:p});setB(false);if(error)setM({e:error.message});else go('/dashboard')};
 return html`<${Shell} t="Login"><form onSubmit=${sub} class="space-y-3"><${Fld} l="Email"><input required type="email" class="inp" value=${e} onInput=${x=>setE(x.target.value)}/><//><${Fld} l="Password"><input required type="password" class="inp" value=${p} onInput=${x=>setP(x.target.value)}/><//><${Msg} m=${m}/><button class="btn w-full" disabled=${b}>${b?'Signing in…':'Login'}</button></form>
 <p class="mt-4 text-sm"><a class="text-emerald-700" href="#/forgot">Forgot password?</a> · <a class="text-emerald-700" href="#/register">Create account</a></p><//>`}
function Register(){const [f,setF]=useState({full_name:'',phone:'',email:'',password:'',role:'tenant'}),[m,setM]=useState(null),[b,setB]=useState(false);
 const s=k=>x=>setF({...f,[k]:x.target.value});
 const sub=async x=>{x.preventDefault();setB(true);
  const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{full_name:f.full_name,phone:f.phone,role:f.role},emailRedirectTo:location.href.split('#')[0]}});setB(false);
  if(error)return setM({e:error.message});
  if(data.session)go('/dashboard');else setM({ok:'Account created. Check your email to confirm, then log in.'})};
 return html`<${Shell} t="Create account"><form onSubmit=${sub} class="space-y-3"><${Fld} l="Full name"><input required minlength="2" class="inp" value=${f.full_name} onInput=${s('full_name')}/><//><${Fld} l="Phone (e.g. 255712345678)"><input class="inp" value=${f.phone} onInput=${s('phone')}/><//>
 <${Fld} l="Email"><input required type="email" class="inp" value=${f.email} onInput=${s('email')}/><//><${Fld} l="Password (min 6)"><input required minlength="6" type="password" class="inp" value=${f.password} onInput=${s('password')}/><//>
 <${Fld} l="I am a…"><select class="inp" value=${f.role} onChange=${s('role')}><option value="tenant">Tenant – looking for a place</option><option value="landlord">Landlord – I own property</option><option value="broker">Broker / Agent</option></select><//>
 <${Msg} m=${m}/><button class="btn w-full" disabled=${b}>${b?'Creating…':'Register'}</button></form><p class="mt-4 text-sm">Have an account? <a class="text-emerald-700" href="#/login">Login</a></p><//>`}
function Forgot(){const [e,setE]=useState(''),[m,setM]=useState(null);
 const sub=async x=>{x.preventDefault();const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});setM(error?{e:error.message}:{ok:'Recovery email sent if the account exists.'})};
 return html`<${Shell} t="Reset password"><form onSubmit=${sub} class="space-y-3"><${Fld} l="Email"><input required type="email" class="inp" value=${e} onInput=${x=>setE(x.target.value)}/><//><${Msg} m=${m}/><button class="btn w-full">Send recovery link</button></form><//>`}
function Reset(){const [p,setP]=useState(''),[m,setM]=useState(null);
 const sub=async x=>{x.preventDefault();const {error}=await sb.auth.updateUser({password:p});if(error)setM({e:error.message});else{setM({ok:'Password updated.'});setTimeout(()=>go('/dashboard'),900)}};
 return html`<${Shell} t="Choose a new password"><form onSubmit=${sub} class="space-y-3"><${Fld} l="New password"><input required minlength="6" type="password" class="inp" value=${p} onInput=${x=>setP(x.target.value)}/><//><${Msg} m=${m}/><button class="btn w-full">Update password</button></form><//>`}

/* ---------- dashboards ---------- */
function Guard({roles,children}){const {user,role,loading}=useAuth();
 if(loading)return html`<${Spin}/>`;
 if(!user)return html`<${Shell} t="Login required"><p class="text-sm">Please <a class="text-emerald-700 underline" href="#/login">log in</a> to continue.</p><//>`;
 if(roles&&!roles.includes(role))return html`<${Shell} t="Access denied"><p class="text-sm">Your role (${ROLE_LABEL[role]}) cannot open this page.</p><a class="btn mt-3" href="#/dashboard">Go to my dashboard</a><//>`;
 return children}
function Dash({path,children}){const {role,profile}=useAuth();
 const owner=['landlord','broker','admin'].includes(role);
 const N=[['/dashboard','Overview'],...(owner?[['/dashboard/new','+ New listing']]:[]),...(role==='admin'?[['/dashboard/users','Users & roles'],['/dashboard/messages','Messages']]:[]),['/dashboard/profile','My profile']];
 const tone={tenant:'bg-sky-600',landlord:'bg-emerald-600',broker:'bg-violet-600',admin:'bg-slate-800'}[role];
 return html`<div class="mx-auto max-w-6xl px-4 py-6 md:flex md:gap-6"><aside class="mb-4 md:w-56 md:shrink-0"><div class=${'rounded-xl p-4 text-white '+tone}><div class="text-xs opacity-80">${ROLE_LABEL[role]} dashboard</div><div class="font-bold">${profile?.full_name}</div></div>
 <nav class="mt-3 flex gap-2 overflow-x-auto md:flex-col">${N.map(([t,n])=>html`<a key=${t} href=${'#'+t} class=${'whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium '+(path===t?'bg-emerald-100 text-emerald-800':'bg-white border md:border-0 hover:bg-slate-100')}>${n}</a>`)}</nav></aside><main class="min-w-0 flex-1">${children}</main></div>`}

function Overview(){const {role,user}=useAuth();const [k,setK]=useState(0);
 const r=useQ(async()=>{if(role==='tenant')return[];let q=sb.from('properties').select(PS).order('created_at',{ascending:false});if(role!=='admin')q=q.eq('owner_id',user.id);return must(await q)},[role,k]);
 if(role==='tenant')return html`<div class="card"><h2 class="text-xl font-bold">Welcome</h2><p class="mt-2 text-sm text-slate-600">Browse listings and contact owners directly from each property page.</p><div class="mt-4 flex flex-wrap gap-2"><a class="btn" href="#/explore">Explore listings</a><a class="btn2" href="#/dashboard/profile">Edit profile</a></div></div>`;
 const act=async(fn)=>{try{await fn();setK(k+1)}catch(e){alert(e.message||e)}};
 const toggle=p=>act(async()=>{const d=must(await sb.from('properties').update({status:p.status==='published'?'draft':'published'}).eq('id',p.id).select('id'));if(!d.length)throw new Error('Not permitted')});
 const del=p=>{if(!confirm('Delete "'+p.title+'" and its media?'))return;act(async()=>{const paths=p.property_images.map(i=>i.storage_path);if(paths.length)await sb.storage.from(B).remove(paths);const d=must(await sb.from('properties').delete().eq('id',p.id).select('id'));if(!d.length)throw new Error('Not permitted')})};
 return html`<div><div class="flex items-center justify-between"><h2 class="text-xl font-bold">${role==='admin'?'All listings':'My listings'}</h2><a class="btn" href="#/dashboard/new">+ New listing</a></div>
 ${r.loading?html`<${Spin}/>`:r.error?html`<${Msg} m=${{e:r.error}}/>`:!r.data.length?html`<div class="card mt-4 text-center text-slate-500">No listings yet.</div>`:
 html`<div class="mt-4 space-y-3">${r.data.map(p=>html`<div key=${p.id} class="card flex flex-wrap items-center gap-3 !p-3"><div class="h-16 w-20 shrink-0 overflow-hidden rounded bg-slate-200">${cover(p)&&html`<img src=${cover(p)} class="h-full w-full object-cover"/>`}</div>
 <div class="min-w-0 flex-1"><a href=${'#/property/'+p.id} class="block truncate font-semibold">${p.title}</a><div class="text-xs text-slate-500">${p.property_categories?.name} · ${tzs(p.price)}/${p.rental_period} · ${p.property_images.length} media · <b class=${p.status==='published'?'text-emerald-700':'text-amber-600'}>${p.status}</b></div></div>
 <div class="flex gap-2"><button class="btn2" onClick=${()=>toggle(p)}>${p.status==='published'?'Unpublish':'Publish'}</button><a class="btn2" href=${'#/dashboard/edit/'+p.id}>Edit</a><button class="btn2 !text-red-600" onClick=${()=>del(p)}>Delete</button></div></div>`)}</div>`}</div>`}

const EMPTY={title:'',category:'apartments',property_type:'',price:'',rental_period:'month',region:'',district:'',ward:'',street:'',bedrooms:1,bathrooms:1,size_sqm:'',furnishing:'unfurnished',description:'',conditions:'',availability:'available',status:'published',amenities:[]};
function PropertyForm({id}){
 const {user}=useAuth();
 const [f,setF]=useState(EMPTY),[media,setMedia]=useState([]),[cv,setCv]=useState(null),[rem,setRem]=useState([]),[busy,setBusy]=useState(''),[m,setM]=useState(null),[ld,setLd]=useState(!!id);
 const set=(k,v)=>setF(x=>({...x,[k]:v}));
 useEffect(()=>{if(!id)return;(async()=>{try{
  const p=must(await sb.from('properties').select(PS).eq('id',id).single()),l=one(p.property_locations)||{},a=must(await sb.from('property_amenities').select('amenity').eq('property_id',id));
  setF({...EMPTY,...p,category:p.property_categories.slug,region:l.region||'',district:l.district||'',ward:l.ward||'',street:l.street||'',size_sqm:p.size_sqm||'',description:p.description||'',conditions:p.conditions||'',amenities:a.map(x=>x.amenity)});
  setMedia([...p.property_images].sort((x,y)=>x.sort_order-y.sort_order).map(i=>({key:i.id,ex:i,url:i.url,kind:i.kind})));
  const c=p.property_images.find(i=>i.is_cover);setCv(c?c.id:null)}catch(e){setM({e:e.message})}setLd(false)})()},[id]);
 const add=async(list,kind)=>{const out=[];
  for(const file of Array.from(list)){try{
   if(kind==='video'){if(file.size>52428800){setM({e:file.name+' is over 50 MB'});continue}out.push({key:crypto.randomUUID(),file,url:URL.createObjectURL(file),kind,ext:(file.name.split('.').pop()||'mp4').toLowerCase()})}
   else{const b=await compress(file);out.push({key:crypto.randomUUID(),file:b,url:URL.createObjectURL(b),kind,ext:b.type==='image/webp'?'webp':'jpg'})}
  }catch(e){setM({e:'Cannot read '+file.name})}}
  setMedia(x=>[...x,...out]);setCv(c=>c||(out.find(o=>o.kind==='image')||{}).key||null)};
 const remove=x=>{if(x.ex)setRem(r=>[...r,x.ex]);setMedia(ms=>ms.filter(y=>y.key!==x.key));if(cv===x.key)setCv(null)};
 const save=async e=>{e.preventDefault();setM(null);
  const err=f.title.trim().length<5?'Title needs at least 5 characters':!f.property_type?'Choose a property type':!(+f.price>0)?'Enter a valid price':!f.region||!f.district?'Region and district are required':null;
  if(err)return setM({e:err});
  try{setBusy('Saving details…');
   const cat=must(await sb.from('property_categories').select('id').eq('slug',f.category).single());
   const row={category_id:cat.id,title:f.title.trim(),property_type:f.property_type,price:+f.price,rental_period:f.rental_period,bedrooms:+f.bedrooms||0,bathrooms:+f.bathrooms||0,size_sqm:f.size_sqm?+f.size_sqm:null,furnishing:f.furnishing,description:f.description,conditions:f.conditions,availability:f.availability,status:f.status};
   let pid=id;
   if(id){if(!must(await sb.from('properties').update(row).eq('id',id).select('id')).length)throw new Error('You are not allowed to edit this listing')}
   else pid=must(await sb.from('properties').insert({...row,owner_id:user.id}).select('id').single()).id;
   must(await sb.from('property_locations').upsert({property_id:pid,region:f.region,district:f.district,ward:f.ward||null,street:f.street||null}));
   must(await sb.from('property_amenities').delete().eq('property_id',pid));
   if(f.amenities.length)must(await sb.from('property_amenities').insert(f.amenities.map(a=>({property_id:pid,amenity:a}))));
   for(const x of rem){await sb.storage.from(B).remove([x.storage_path]);must(await sb.from('property_images').delete().eq('id',x.id))}
   const ids={};let n=0;const fresh=media.filter(x=>!x.ex);
   for(const x of fresh){n++;setBusy(`Uploading media ${n}/${fresh.length}…`);
    const path=`${user.id}/${pid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${x.ext}`;
    must(await sb.storage.from(B).upload(path,x.file,{contentType:x.file.type||'application/octet-stream'}));
    const url=sb.storage.from(B).getPublicUrl(path).data.publicUrl;
    ids[x.key]=must(await sb.from('property_images').insert({property_id:pid,kind:x.kind,storage_path:path,url,sort_order:media.indexOf(x)}).select('id').single()).id}
   setBusy('Finishing…');
   must(await sb.from('property_images').update({is_cover:false}).eq('property_id',pid).select('id'));
   const cid=ids[cv]||cv;if(cid)must(await sb.from('property_images').update({is_cover:true}).eq('id',cid).select('id'));
   go('/dashboard')
  }catch(e){setM({e:(e.message||String(e))+' — if media was uploaded, open Edit to retry.'})}setBusy('')};
 if(ld)return html`<${Spin}/>`;
 const num=(k,l)=>html`<${Fld} l=${l}><input type="number" min="0" class="inp" value=${f[k]} onInput=${e=>set(k,e.target.value)}/><//>`;
 return html`<form onSubmit=${save} class="space-y-5"><h2 class="text-xl font-bold">${id?'Edit listing':'New listing'}</h2>
 <section class="card grid gap-3 sm:grid-cols-2"><${Fld} c="sm:col-span-2" l="Property title *"><input class="inp" value=${f.title} onInput=${e=>set('title',e.target.value)} placeholder="e.g. Modern 2-bedroom flat near Uyole market"/><//>
 <${Fld} l="Category *"><select class="inp" value=${f.category} onChange=${e=>setF({...f,category:e.target.value,property_type:''})}>${CATS.map(c=>html`<option key=${c.slug} value=${c.slug}>${c.name}</option>`)}</select><//>
 <${Fld} l="Property type *"><${Sel} v=${f.property_type} on=${v=>set('property_type',v)} opts=${TYPES[f.category]} ph="Select…"/><//>
 <${Fld} l="Rental price (TSh) *"><input type="number" min="1" class="inp" value=${f.price} onInput=${e=>set('price',e.target.value)}/><//>
 <${Fld} l="Rental period *"><${Sel} v=${f.rental_period} on=${v=>set('rental_period',v)} opts=${['day','week','month','year']}/><//>
 ${num('bedrooms','Bedrooms')}${num('bathrooms','Bathrooms')}${num('size_sqm','Size (m²)')}
 <${Fld} l="Furnishing"><${Sel} v=${f.furnishing} on=${v=>set('furnishing',v)} opts=${['furnished','semi-furnished','unfurnished']}/><//>
 <${Fld} l="Availability"><${Sel} v=${f.availability} on=${v=>set('availability',v)} opts=${['available','rented','unavailable']}/><//>
 <${Fld} l="Visibility"><${Sel} v=${f.status} on=${v=>set('status',v)} opts=${['published','draft','archived']}/><//></section>
 <section class="card grid gap-3 sm:grid-cols-2"><h3 class="font-semibold sm:col-span-2">Location</h3><${Fld} l="Region *"><${Sel} v=${f.region} on=${v=>set('region',v)} opts=${REGIONS} ph="Select…"/><//>
 <${Fld} l="District *"><input class="inp" value=${f.district} onInput=${e=>set('district',e.target.value)}/><//><${Fld} l="Ward"><input class="inp" value=${f.ward} onInput=${e=>set('ward',e.target.value)}/><//><${Fld} l="Street"><input class="inp" value=${f.street} onInput=${e=>set('street',e.target.value)}/><//></section>
 <section class="card space-y-3"><${Fld} l="Description"><textarea rows="5" class="inp" value=${f.description} onInput=${e=>set('description',e.target.value)}></textarea><//>
 <${Fld} l="Rental conditions (deposit, contract length, rules…)"><textarea rows="3" class="inp" value=${f.conditions} onInput=${e=>set('conditions',e.target.value)}></textarea><//>
 <div><div class="mb-1 text-sm font-medium">Amenities & facilities</div><div class="flex flex-wrap gap-2">${AMEN.map(a=>{const on=f.amenities.includes(a);return html`<button type="button" key=${a} onClick=${()=>set('amenities',on?f.amenities.filter(x=>x!==a):[...f.amenities,a])} class=${'rounded-full border px-3 py-1 text-xs '+(on?'border-emerald-600 bg-emerald-600 text-white':'bg-white')}>${a}</button>`})}</div></div></section>
 <section class="card"><h3 class="font-semibold">Photos & video</h3><p class="text-xs text-slate-500">Images are resized to max 1600px and compressed before upload. Videos up to 50 MB.</p>
 <div class="mt-3 flex flex-wrap gap-2"><label class="btn2 cursor-pointer">📁 Choose images<input type="file" accept="image/*" multiple hidden onChange=${e=>{add(e.target.files,'image');e.target.value=''}}/></label>
 <label class="btn2 cursor-pointer">📷 Take photo<input type="file" accept="image/*" capture="environment" hidden onChange=${e=>{add(e.target.files,'image');e.target.value=''}}/></label>
 <label class="btn2 cursor-pointer">🎬 Add video<input type="file" accept="video/*" hidden onChange=${e=>{add(e.target.files,'video');e.target.value=''}}/></label></div>
 <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">${media.map(x=>html`<div key=${x.key} class=${'overflow-hidden rounded-lg border '+(cv===x.key?'ring-2 ring-emerald-600':'')}>
 <div class="aspect-[4/3] bg-slate-100">${x.kind==='video'?html`<video src=${x.url} class="h-full w-full object-cover" controls preload="metadata"></video>`:html`<img src=${x.url} class="h-full w-full object-cover"/>`}</div>
 <div class="flex items-center justify-between gap-1 p-1.5 text-xs">${x.kind==='image'?html`<button type="button" class=${cv===x.key?'font-bold text-emerald-700':'text-slate-600'} onClick=${()=>setCv(x.key)}>${cv===x.key?'★ Cover':'☆ Set cover'}</button>`:html`<span>Video</span>`}<button type="button" class="text-red-600" onClick=${()=>remove(x)}>Delete</button></div></div>`)}</div>
 ${!media.length&&html`<p class="mt-3 text-sm text-slate-500">No media yet. To replace a file, delete it and add a new one.</p>`}</section>
 <${Msg} m=${m}/><div class="flex gap-2"><button class="btn" disabled=${!!busy}>${busy||(id?'Save changes':'Create listing')}</button><a class="btn2" href="#/dashboard">Cancel</a></div></form>`}

function Users(){const [k,setK]=useState(0);
 const r=useQ(async()=>{const p=must(await sb.from('profiles').select('*').order('created_at',{ascending:false})),ro=must(await sb.from('user_roles').select('*'));const mp=Object.fromEntries(ro.map(x=>[x.user_id,x.role]));return p.map(x=>({...x,role:mp[x.id]||'tenant'}))},[k]);
 const chg=async(u,role)=>{const {data,error}=await sb.from('user_roles').update({role}).eq('user_id',u).select('user_id');if(error||!data.length)alert(error?error.message:'Not permitted');setK(k+1)};
 return html`<div><h2 class="mb-3 text-xl font-bold">Users & roles</h2>${r.loading?html`<${Spin}/>`:r.error?html`<${Msg} m=${{e:r.error}}/>`:html`<div class="space-y-2">${r.data.map(u=>html`<div key=${u.id} class="card flex flex-wrap items-center justify-between gap-2 !p-3"><div><div class="font-semibold">${u.full_name}</div><div class="text-xs text-slate-500">${u.phone||'no phone'}</div></div><${Sel} v=${u.role} on=${v=>chg(u.id,v)} opts=${['tenant','landlord','broker','admin']}/></div>`)}</div>`}</div>`}
function Messages(){const r=useQ(async()=>must(await sb.from('contact_messages').select('*').order('created_at',{ascending:false})),[]);
 return html`<div><h2 class="mb-3 text-xl font-bold">Contact messages</h2>${r.loading?html`<${Spin}/>`:r.error?html`<${Msg} m=${{e:r.error}}/>`:!r.data.length?html`<div class="card text-slate-500">No messages.</div>`:r.data.map(x=>html`<div key=${x.id} class="card mb-2 !p-3"><div class="text-sm font-semibold">${x.name} · ${x.email}</div><p class="whitespace-pre-line text-sm">${x.message}</p><div class="text-xs text-slate-400">${new Date(x.created_at).toLocaleString()}</div></div>`)}</div>`}
function Profile(){const {profile,user,reload}=useAuth();const [n,setN]=useState(profile?.full_name||''),[ph,setPh]=useState(profile?.phone||''),[pw,setPw]=useState(''),[m,setM]=useState(null);
 const save=async e=>{e.preventDefault();const {data,error}=await sb.from('profiles').update({full_name:n,phone:ph}).eq('id',user.id).select('id');
  if(error||!data.length)return setM({e:error?error.message:'Update failed'});await reload();setM({ok:'Profile saved.'})};
 const pass=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:pw});setPw('');setM(error?{e:error.message}:{ok:'Password changed.'})};
 return html`<div class="space-y-5"><h2 class="text-xl font-bold">My profile</h2><form onSubmit=${save} class="card space-y-3"><${Fld} l="Email"><input disabled class="inp bg-slate-100" value=${user.email}/><//><${Fld} l="Full name"><input required minlength="2" class="inp" value=${n} onInput=${e=>setN(e.target.value)}/><//><${Fld} l="Phone"><input class="inp" value=${ph} onInput=${e=>setPh(e.target.value)}/><//><button class="btn">Save profile</button></form>
 <form onSubmit=${pass} class="card space-y-3"><${Fld} l="New password"><input required minlength="6" type="password" class="inp" value=${pw} onInput=${e=>setPw(e.target.value)}/><//><button class="btn2">Change password</button></form><${Msg} m=${m}/></div>`}

/* ---------- router ---------- */
function Routes({h}){
 const path=h.split('?')[0],s=path.split('/').filter(Boolean);
 const L=(cat,t,sub)=>html`<${Listing} key=${cat||'all'} cat=${cat} title=${t} sub=${sub}/>`;
 if(!s.length)return html`<${Home}/>`;
 switch(s[0]){
  case'explore':return L(null,'Explore all listings','Apartments, homestays and rooms across Tanzania');
  case'apartments':return L('apartments','Apartments','Flats, studios and serviced apartments');
  case'homestays':return L('homestays','Homestays','Stay with local hosts');
  case'rooms':return L('rooms','Rooms for Rent (Vyumba vya Kupanga)','Affordable rooms to rent');
  case'property':return html`<${Details} key=${s[1]} id=${s[1]}/>`;
  case'login':return html`<${Login}/>`;case'register':return html`<${Register}/>`;case'forgot':return html`<${Forgot}/>`;case'reset':return html`<${Reset}/>`;
  case'about':return html`<${About}/>`;case'contact':return html`<${Contact}/>`;
  case'dashboard':{const sub=s[1];const D=c=>html`<${Guard}><${Dash} path=${path}>${c}<//><//>`;
   const OW=['landlord','broker','admin'];
   if(!sub)return D(html`<${Overview}/>`);
   if(sub==='profile')return D(html`<${Profile}/>`);
   if(sub==='new')return html`<${Guard} roles=${OW}><${Dash} path=${path}><${PropertyForm} key="new"/><//><//>`;
   if(sub==='edit')return html`<${Guard} roles=${OW}><${Dash} path=${path}><${PropertyForm} key=${s[2]} id=${s[2]}/><//><//>`;
   if(sub==='users')return html`<${Guard} roles=${['admin']}><${Dash} path=${path}><${Users}/><//><//>`;
   if(sub==='messages')return html`<${Guard} roles=${['admin']}><${Dash} path=${path}><${Messages}/><//><//>`}}
 return html`<div class="p-16 text-center"><h1 class="text-4xl font-bold">404</h1><p class="mt-2 text-slate-500">Page not found.</p><a class="btn mt-4" href="#/">Home</a></div>`}

function App(){const h=useHash();
 if(!sb)return html`<${Setup}/>`;
 return html`<${AuthProvider}><${Nav}/><${Boundary} key=${h}><${Routes} h=${h}/><//><${Footer}/><//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
